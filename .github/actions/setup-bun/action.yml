name: Setup Bun
description: Installs the repo-pinned Node and Bun toolchains and runs bun install with the frozen lockfile.

runs:
  using: composite
  steps:
    # Node is pinned rather than inherited from the runner image because `bun run test:node` is the
    # check that keeps this repo's one hard constraint honest — the packages load under plain Node,
    # not under Bun. Which Node that is therefore decides what the check proves. 24 is the floor the
    # Java and Kotlin packages declare in `engines`: on Node 22 they format correctly, but V8's wasm
    # optimizer grows without bound on those modules until the process is killed.
    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 24

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.11

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
