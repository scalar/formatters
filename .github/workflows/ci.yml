name: CI

# Job-shaped table of contents. The repeated toolchain setup lives in
# .github/actions/setup-bun; open that to read what "Setup Bun" actually does.
#
# Runners: the blacksmith-<n>vcpu-ubuntu-2404 labels the rest of the Scalar org uses. They only
# resolve once the repository is enrolled with Blacksmith, and a job asking for a label nobody
# offers queues forever rather than failing — so until the move to scalar/formatters lands and
# enrollment is confirmed, every job here queues. 4vcpu uniformly; the test suite is the long
# pole (it boots a wasm runtime per package) if one of them ever needs sizing up.
on:
  push:
    branches:
      - main
      - changeset-release/main
  pull_request:
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run build

  lint:
    name: Lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run checks
        run: bun run check

  type-check:
    name: Type Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run type checks
        run: bun run types:check

  test:
    name: Test Suite
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run unit tests
        run: bun run test

  # The repo's one hard constraint, as a job: every published package loads and formats under plain
  # Node with no Bun in the process. `bun run test:node` builds first, so this does not need the
  # build job's output.
  node-smoke:
    name: Node Smoke Test (${{ matrix.node-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    # Both ends of the supported range, because each one catches what the other cannot. 24.15.0 is
    # the floor the Java and Kotlin packages declare in `engines`, and running it here is the only
    # thing that keeps that number honest. The newest release catches the reverse: a Node that
    # stops running an artifact these packages promise it runs.
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.15.0
          - 26.7.0

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          node-version: ${{ matrix.node-version }}

      - name: Load the built packages under plain Node
        run: bun run test:node
