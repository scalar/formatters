name: CI

# Job-shaped table of contents. The repeated toolchain setup lives in
# .github/actions/setup-bun; open that to read what "Setup Bun" actually does.
#
# Runners: GitHub-hosted `ubuntu-24.04`, temporarily. The rest of the Scalar org runs on the
# blacksmith-<n>vcpu-ubuntu-2404 labels, and this repo is meant to as well — the enrollment
# works, but jobs sat queued for want of capacity, and a job asking for a label nobody is
# offering queues forever rather than failing, so there is no signal to read while that lasts.
# Going back is a label swap in this file, changeset-status.yml and release.yml: the image is
# the same 24.04, so nothing else here depends on which one serves it. 4vcpu when it moves
# back; the test suite is the long pole (it boots a wasm runtime per package) if one of them
# ever needs sizing up.
on:
  push:
    branches:
      - main
      - changeset-release/main
  pull_request:
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Build
        run: bun run build

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run checks
        run: bun run check

  type-check:
    name: Type Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      - name: Run type checks
        run: bun run types:check

  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun

      # packages/ruby's conformance test is what backs the "exact" claim in the README, and it
      # skips itself when there is no native syntax_tree to compare against - so without these two
      # steps it has never actually run here. syntax_tree is pure Ruby and installs in seconds,
      # which makes Ruby the one reference tool cheap enough for CI to carry; the others need a
      # .NET SDK, a Rust nightly or a JDK and still skip.
      #
      # Ruby 3.4 because that is what build/ruby_fmt/build.sh bakes into the artifact. Ripper is
      # part of CRuby rather than the gem, so a different Ruby here could diverge for reasons that
      # are nothing to do with this package.
      - name: Setup Ruby to match the artifact
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'

      # The version comes from the Gemfile the artifact is built from rather than being written
      # out again here, so the native side and the wasm side cannot drift apart. The test reads
      # the same pin and skips rather than compares if what is installed does not match it.
      - name: Install the pinned syntax_tree
        run: gem install syntax_tree --no-document -v "$(sed -n 's/^gem "syntax_tree", "\(.*\)"$/\1/p' build/ruby_fmt/Gemfile)"

      - name: Run unit tests
        run: bun run test

  # The repo's one hard constraint, as a job: every published package loads and formats under plain
  # Node with no Bun in the process. `bun run test:node` builds first, so this does not need the
  # build job's output.
  node-smoke:
    name: Node Smoke Test (${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # Both ends of the supported range, because each one catches what the other cannot. 24.15.0 is
    # the floor the Java and Kotlin packages declare in `engines`, and running it here is the only
    # thing that keeps that number honest. The newest release catches the reverse: a Node that
    # stops running an artifact these packages promise it runs.
    #
    # The upper end is a version, not `latest`, for the same reason the lower one is: a floating
    # major is served from the runner image's tool cache and so silently drifts. The cost is that
    # it only tests what someone last wrote here - bump it when a new Node major or LTS lands,
    # which is the point at which it has something new to say.
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.15.0
          - 26.7.0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Bun and install dependencies
        uses: ./.github/actions/setup-bun
        with:
          node-version: ${{ matrix.node-version }}

      - name: Load the built packages under plain Node
        run: bun run test:node
